name: Auto-merge PRs

# Merges any non-draft PR into main 10 minutes after it is opened or last
# pushed to, if GitHub reports it has no conflicts. A new push restarts the
# 10-minute timer; closing the PR or converting it to a draft during the wait
# stops the merge. PRs with conflicts get a comment and are retried when the
# author pushes a fix.
#
# pull_request_target runs in the context of the base repo so the token can
# merge fork PRs. The PR's code is never checked out or executed here.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One queue per PR: a new push to the same PR cancels its pending run and
# restarts the wait. Manual sweeps use their own group.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 10 minutes before merging
        if: github.event_name == 'pull_request_target'
        run: sleep 600

      - name: Merge conflict-free PRs
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            prs="$PR_NUMBER"
          else
            prs=$(gh pr list --base main --state open --limit 200 --json number,isDraft -q '.[] | select(.isDraft | not) | .number')
          fi

          for n in $prs; do
            read -r pr_state draft < <(gh pr view "$n" --json state,isDraft -q '"\(.state) \(.isDraft)"')
            if [ "$pr_state" != "OPEN" ]; then
              echo "#$n is $pr_state, skipping"
              continue
            fi
            if [ "$draft" = "true" ]; then
              echo "#$n is a draft, skipping"
              continue
            fi

            # Mergeability is computed asynchronously; wait for it to settle.
            state=UNKNOWN
            for i in $(seq 1 24); do
              state=$(gh pr view "$n" --json mergeable -q .mergeable)
              [ "$state" != "UNKNOWN" ] && break
              sleep 5
            done

            case "$state" in
              MERGEABLE)
                gh pr merge "$n" --merge && echo "Merged #$n" || echo "::warning::Failed to merge #$n"
                ;;
              CONFLICTING)
                echo "#$n has conflicts"
                if [ -n "$PR_NUMBER" ]; then
                  gh pr comment "$n" --body "This PR has merge conflicts with \`main\`. Please rebase on (or merge) the latest \`main\`, resolve the conflicts and push — it will be merged automatically once it's conflict-free."
                fi
                ;;
              *)
                echo "::warning::#$n mergeability still $state, skipping"
                ;;
            esac
          done
